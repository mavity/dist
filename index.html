<body>
  <script src="./washmhost.js"></script>
  <script>
    (function () {
      'use strict';

      function ensureWashmhostLoaded() {
        if (window.washmhostExports && typeof window.washmhostExports.loadVegetable === 'function') {
          return Promise.resolve(window.washmhostExports);
        }
        return new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = './mohabbat/washmhost/js/browser/index.js';
          script.onload = () => {
            if (window.washmhostExports && typeof window.washmhostExports.loadVegetable === 'function') {
              resolve(window.washmhostExports);
            } else {
              reject(new Error('washmhost loaded but did not expose loadVegetable'));
            }
          };
          script.onerror = () => reject(new Error('Failed to load ./mohabbat/washmhost/js/browser/index.js'));
          document.head.appendChild(script);
        });
      }

      const params = new URLSearchParams(location.search);
      window.__super_demo__ = params.get('super_demo') !== '0';

      const customArtifact = params.get('artifact') || params.get('wasm');
      const candidates = customArtifact
        ? [customArtifact]
        : ['./kabibi.bat', './release/dist/kabibi.bat'];

      ensureWashmhostLoaded()
        .then((washmhostExports) => washmhostExports.loadVegetable(candidates))
        .catch((error) => {
          console.error('Kabibi failed to start:', error);
        });
    })();
  </script>
